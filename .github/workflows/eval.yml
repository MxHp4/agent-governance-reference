name: evaluation-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  policy-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run policy and golden-corpus tests
        working-directory: src
        run: python -m unittest discover -p 'test_*.py' -v
